    <text x="12" y="55" class="box-sub">50 filas - dimension</text>
    <text x="12" y="76" class="pk">PK SucursalID</text>
    <text x="12" y="96" class="fk">FK GeografiaID</text>
    <text x="12" y="116" class="col">tipo, m2_ventas, empleados</text>
  </g>

  <g class="fact" transform="translate(510 250)" filter="url(#shadow)">
    <rect class="body" width="230" height="214" rx="12"/>
    <rect class="head" width="230" height="44" rx="12"/>
    <path d="M0 34H230V50H0Z" fill="#9a1837"/>
    <text x="14" y="27" class="box-title">fact_ventas_base_ar</text>
    <text x="14" y="62" class="box-sub">150.000 filas - hecho AR</text>
    <text x="14" y="84" class="pk">PK VentaID</text>
    <text x="14" y="104" class="fk">FK ClienteID</text>
    <text x="14" y="124" class="fk">FK CanalID</text>
    <text x="14" y="144" class="fk">FK SucursalID</text>
    <text x="14" y="164" class="col">fecha, medio_pago, cuotas</text>
    <text x="14" y="184" class="col">tipo_entrega, plazo_entrega</text>
    <text x="14" y="204" class="col">precio, costo, cantidad</text>
