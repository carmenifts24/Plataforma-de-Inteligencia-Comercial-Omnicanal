    <rect class="head" width="206" height="38" rx="10"/>
    <path d="M0 30H206V44H0Z" fill="#174b93"/>
    <text x="12" y="24" class="box-title">dim_canal_ar</text>
    <text x="12" y="55" class="box-sub">4 filas - dimension compartida</text>
    <text x="12" y="76" class="pk">PK CanalID</text>
