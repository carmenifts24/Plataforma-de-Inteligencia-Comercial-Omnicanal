    <rect class="head" width="226" height="38" rx="10"/>
    <path d="M0 30H226V44H0Z" fill="#176b3a"/>
    <text x="12" y="24" class="box-title">dim_inflacion_ipc</text>
    <text x="12" y="55" class="box-sub">111 filas - dimension tiempo IPC</text>
    <text x="12" y="76" class="calc">anio + mes = anio_mes</text>
    <text x="12" y="96" class="col">fecha, ipc_nivel_general</text>
    <text x="12" y="116" class="col">ipc por rubro</text>
  </g>

  <g class="fact" transform="translate(1365 558)" filter="url(#shadow)">
    <rect class="body" width="250" height="210" rx="12"/>
    <rect class="head" width="250" height="44" rx="12"/>
    <path d="M0 34H250V50H0Z" fill="#9a1837"/>
    <text x="14" y="27" class="box-title">fact_ventas</text>
    <text x="14" y="62" class="box-sub">110.197 filas - hecho Olist</text>
    <text x="14" y="84" class="col">order_id, product_id, seller_id</text>
    <text x="14" y="104" class="col">fecha, anio, mes, trimestre</text>
    <text x="14" y="124" class="calc">anio_mes calculada</text>
    <text x="14" y="144" class="col">category_en</text>
    <text x="14" y="164" class="col">price_brl, price_ars</text>
    <text x="14" y="184" class="col">ipc, price_ars_real</text>
  </g>

  <!-- CACE reference band -->
  <g transform="translate(40 895)">
    <rect width="1840" height="210" rx="18" class="zone-cace"/>
    <text x="22" y="34" class="zone-title" fill="#ffd083">Benchmarks CACE - tablas de referencia</text>
    <text x="22" y="56" class="zone-note" fill="#e9c98c">No tienen relaciones formales en Power BI. Se comparan en visualizaciones por categoria, canal, region, medios de pago, logistica y perfil.</text>
  </g>

  <g class="ref" transform="translate(70 975)" filter="url(#shadow)">
