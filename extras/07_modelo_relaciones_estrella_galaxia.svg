    <text x="12" y="116" class="col">plataforma, flag_online</text>
    <text x="12" y="136" class="col">peso_facturacion</text>
  </g>

  <g class="fact" transform="translate(810 525)" filter="url(#shadow)">
    <rect class="body" width="230" height="166" rx="12"/>
    <rect class="head" width="230" height="44" rx="12"/>
    <path d="M0 34H230V50H0Z" fill="#9a1837"/>
    <text x="14" y="27" class="box-title">fact_precios_comp</text>
    <text x="14" y="62" class="box-sub">360 filas - hecho precios</text>
    <text x="14" y="84" class="pk">PK PrecioID</text>
    <text x="14" y="104" class="fk">FK CanalID</text>
    <text x="14" y="124" class="col">categoria, anio, mes</text>
    <text x="14" y="144" class="col">precio_web, competencia</text>
  </g>

  <g class="dim-green" transform="translate(1365 190)" filter="url(#shadow)">
