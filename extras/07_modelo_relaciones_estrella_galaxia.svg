  <text x="960" y="850" text-anchor="middle" class="note">Interpretacion: el modelo completo se lee como una galaxia porque contiene mas de una tabla de hechos. Cada hecho tiene su propia estrella de dimensiones, y algunas dimensiones pueden compartirse.</text>
</svg>
