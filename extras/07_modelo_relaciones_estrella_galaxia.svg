  <!-- Legend and conceptual key -->
  <g transform="translate(40 1128)">
    <rect x="0" y="-28" width="1840" height="42" rx="9" fill="#111a2b" stroke="#253a5b"/>
    <rect x="18" y="-17" width="18" height="18" rx="4" fill="#9a1837" stroke="#ef4b6d"/>
    <text x="44" y="-3" class="legend-text">Tabla de hechos</text>
    <rect x="188" y="-17" width="18" height="18" rx="4" fill="#174b93" stroke="#2f80ed"/>
    <text x="214" y="-3" class="legend-text">Dimension AR</text>
    <rect x="338" y="-17" width="18" height="18" rx="4" fill="#176b3a" stroke="#27ae60"/>
    <text x="364" y="-3" class="legend-text">Dimension Olist/IPC</text>
    <rect x="548" y="-17" width="18" height="18" rx="4" fill="#7d570e" stroke="#d99a25"/>
    <text x="574" y="-3" class="legend-text">Referencia CACE</text>
    <text x="750" y="-3" class="legend-text">PK = clave primaria</text>
    <text x="910" y="-3" class="legend-text">FK = clave foranea</text>
    <text x="1080" y="-3" class="legend-text">Lineas solidas = relaciones formales N:1</text>
    <text x="1395" y="-3" class="legend-text">Linea punteada = comparacion, no relacion formal</text>
