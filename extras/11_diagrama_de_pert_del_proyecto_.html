<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Diagrama de PERT - RetailIQ 360°</title>
    <!-- Tailwind CSS para diseño rápido y responsivo -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        fase1: '#704ba0',
                        fase2: '#315fba',
                        fase3: '#cfab3c',
                        fase4: '#8f4f1f',
                        fase5: '#92352b',
                        fase6: '#3c6e4c',
                    }
                }
            }
        }
    </script>
    <!-- Lucide Icons para vectores limpios -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        /* Animación para el flujo de la ruta crítica */
        @keyframes dash {
            to {
                stroke-dashoffset: -20;
            }
        }
        .critical-path-arrow {
            stroke-dasharray: 6, 4;
            animation: dash 1s linear infinite;
        }
    </style>
</head>
<body class="bg-slate-100 min-h-screen font-sans text-slate-800 antialiased">

    <div class="max-w-7xl mx-auto p-4 md:p-8 space-y-6">
        
        <!-- ENCABEZADO -->
        <header class="bg-white rounded-2xl p-6 shadow-sm border border-slate-200/80 flex flex-col md:flex-row md:items-center justify-between gap-4">
            <div>
                <span class="bg-rose-50 text-rose-700 text-xs font-semibold px-2.5 py-1 rounded-full uppercase tracking-wider">
                    Planificación de Ruta Crítica (PERT)
                </span>
                <h1 class="text-2xl md:text-3xl font-extrabold text-slate-900 tracking-tight mt-2">
                    Análisis de Tiempos y Dependencias — RetailIQ 360°
                </h1>
                <p class="text-slate-500 mt-1.5 flex items-center gap-2 text-sm">
                    <i data-lucide="info" class="w-4 h-4 text-slate-400"></i>
                    <span class="font-medium text-slate-700">Duración estimada: 56 días de proyecto</span>
                    <span class="text-slate-300">•</span>
                    <span class="font-bold text-rose-600">Ruta Crítica Activada</span>
                </p>
            </div>
            
            <div class="flex items-center gap-3">
                <button onclick="toggleCriticalHighlight()" id="btn-toggle-critical" class="flex items-center gap-2 px-4 py-2.5 rounded-xl text-sm font-bold bg-rose-600 text-white shadow-md hover:bg-rose-700 transition-all">
                    <i data-lucide="zap" class="w-4 h-4"></i>
                    Destacar Ruta Crítica
                </button>
            </div>
        </header>

        <!-- CONTENIDO PRINCIPAL -->
        <div class="grid grid-cols-1 lg:grid-cols-4 gap-6">
            
            <!-- CONTENEDOR DEL DIAGRAMA DE PERT (Ocupa 3 de 4 columnas) -->
            <div class="lg:col-span-3 bg-white rounded-2xl border border-slate-200/80 shadow-sm overflow-hidden flex flex-col">
                <div class="p-4 bg-slate-50 border-b border-slate-150 flex items-center justify-between">
                    <span class="text-xs font-bold text-slate-500 uppercase tracking-wider">Mapa de Red de Actividades (PERT)</span>
                    <span class="text-[10px] text-slate-400 font-medium">Usa el scroll horizontal si es necesario</span>
                </div>
                
                <!-- Lienzo del Diagrama con Scroll Horizontal -->
                <div class="p-6 overflow-auto">
                    <div class="relative w-[1200px] h-[580px] bg-slate-50/40 rounded-xl border border-slate-100">
                        
                        <!-- SVG para Flechas y Conectores -->
                        <svg class="absolute inset-0 w-full h-full pointer-events-none" id="pert-svg-canvas">
                            <defs>
                                <!-- Marcador de Flecha Normal -->
                                <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
                                    <path d="M 0 1 L 10 5 L 0 9 z" fill="#94a3b8" />
                                </marker>
                                <!-- Marcador de Flecha Crítica -->
                                <marker id="arrow-critical" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
                                    <path d="M 0 1 L 10 5 L 0 9 z" fill="#f43f5e" />
                                </marker>
                            </defs>
                            
                            <!-- Las líneas se inyectarán dinámicamente mediante javascript para asegurar coordenadas exactas -->
                        </svg>

                        <!-- Capa de Nodos (Tarjetas HTML posicionadas de manera absoluta) -->
                        <div id="nodes-container" class="absolute inset-0">
                            <!-- Nodos inyectados dinámicamente -->
                        </div>

                    </div>
                </div>
            </div>

            <!-- PANEL DE DETALLES E INSPECTOR DE ETAPAS (Ocupa 1 de 4 columnas) -->
            <div class="lg:col-span-1 space-y-6">
                
                <!-- Guía de Lectura de PERT -->
                <div class="bg-white rounded-2xl p-4 border border-slate-200/80 shadow-sm">
                    <h3 class="text-xs font-bold text-slate-400 uppercase tracking-widest mb-3 flex items-center gap-1.5">
                        <i data-lucide="book-open" class="w-4 h-4 text-slate-400"></i> Guía de Lectura de Nodos
                    </h3>
                    <div class="border border-slate-200 rounded-xl p-3 bg-slate-50 space-y-2">
                        <div class="grid grid-cols-3 gap-1 text-center font-mono text-[9px] font-bold">
                            <div class="bg-indigo-100 text-indigo-700 p-1 rounded" title="Pronto Inicio (Early Start)">ES</div>
                            <div class="bg-slate-200 text-slate-700 p-1 rounded" title="Duración en días (t)">t</div>
                            <div class="bg-indigo-100 text-indigo-700 p-1 rounded" title="Pronto Fin (Early Finish)">EF</div>
                        </div>
                        <div class="text-center font-extrabold text-xs text-slate-800 border-y border-slate-200 py-1.5">
                            ID: Título de la Etapa
                        </div>
                        <div class="grid grid-cols-3 gap-1 text-center font-mono text-[9px] font-bold">
                            <div class="bg-emerald-100 text-emerald-700 p-1 rounded" title="Tarde Inicio (Late Start)">LS</div>
                            <div class="bg-rose-100 text-rose-700 p-1 rounded" title="Holgura (Slack)">H</div>
                            <div class="bg-emerald-100 text-emerald-700 p-1 rounded" title="Tarde Fin (Late Finish)">LF</div>
                        </div>
                    </div>
                </div>

                <!-- Detalle de la Etapa Seleccionada -->
                <div id="pert-details-panel" class="bg-white rounded-2xl border border-slate-200/80 shadow-sm overflow-hidden">
                    <!-- Contenido inyectado dinámicamente -->
                </div>

            </div>

        </div>

    </div>

    <script>
        // Datos de los Nodos del PERT basados en la estructura del proyecto RetailIQ 360°
        const pertNodes = [
            {
                id: 1,
                label: "ETL de Datos & Capa AR",
                fase: "Fase 1",
                t: 15,
                es: 0, ef: 15,
                ls: 0, lf: 15,
                holgura: 0,
                isCritical: true,
                color: "#704ba0",
                colorClass: "border-fase1",
                bgClass: "bg-fase1",
                x: 30, y: 260,
                tasks: [
                    "Limpieza y procesamiento de base transaccional Olist",
                    "Ajuste e inclusión de márgenes de Sample Superstore",
                    "Descarga y procesamiento del deflactor mensual de inflación del IPC INDEC",
                    "Conversión cambiaria BRL a ARS (DimInflacion)",
                    "Generación de datos sintéticos argentinos con Faker (Framer, canales, sucursales)",
                    "Integrar FactVentas + FactVentasBase -> fact_ventas_final.csv (Acción crítica inmediata)"
                ],
                entregable: "fact_ventas_final.csv validado por semáforo y diccionario de datos listo."
            },
            {
                id: 2,
                label: "Modelado Relacional Galaxia",
                fase: "Fase 2",
                t: 9,
                es: 15, ef: 24,
                ls: 15, lf: 24,
                holgura: 0,
                isCritical: true,
                color: "#315fba",
                colorClass: "border-fase2",
                bgClass: "bg-fase2",
                x: 230, y: 260,
                tasks: [
                    "Carga de tablas procesadas a Power BI Desktop",
                    "Configuración del esquema galaxia (dos tablas de hechos y dimensiones compartidas)",
                    "Establecer relaciones inactivas de FactPreciosComp con USERELATIONSHIP",
                    "Establecer jerarquías temporales en DimTiempo",
                    "Validar semáforo parcial de reconciliación de datos"
                ],
                entregable: "Archivo RetailIQ360.pbix configurado con relaciones lógicas correctas y semáforo validado."
            },
            {
                id: 3,
                label: "Medidas DAX de Ventas",
                fase: "Fase 3",
                t: 7,
                es: 24, ef: 31,
                ls: 24, lf: 31,
                holgura: 0,
                isCritical: true,
                color: "#cfab3c",
                colorClass: "border-fase3",
                bgClass: "bg-fase3",
                x: 430, y: 110,
                tasks: [
                    "Creación de tabla auxiliar vacía _Medidas",
                    "Estructurar medidas de ventas base (Ventas Totales, Costos, Ticket promedio, etc.)",
                    "Desarrollo de lógica de Inteligencia de Tiempo (YTD, MTD, variación YoY)",
                    "Implementación de medidas ajustadas por inflación (Ventas reales vs nominales)"
                ],
                entregable: "Ficha de medidas de ventas completa y testeada sin BLANKs en tabla _Medidas."
            },
            {
                id: 4,
                label: "Medidas DAX de Pricing",
                fase: "Fase 3",
                t: 7,
                es: 24, ef: 31,
                ls: 34, lf: 41,
                holgura: 10,
                isCritical: false,
                color: "#cfab3c",
                colorClass: "border-fase3",
                bgClass: "bg-fase3",
                x: 430, y: 260,
                tasks: [
                    "Activar USERELATIONSHIP para FactPreciosComp en DAX",
                    "Escribir medidas de Price Index (posicionamiento frente a competencia)",
                    "Definición de descuentos promedios y sell-through rate",
                    "Configurar Parámetros What-If para simulación interactiva de descuento vs margen"
                ],
                entregable: "Estructuras DAX de pricing operativas con simulación de escenarios What-If."
            },
            {
                id: 5,
                label: "RFM & Market Basket Analysis",
                fase: "Fase 4",
                t: 10,
                es: 31, ef: 41,
                ls: 31, lf: 41,
                holgura: 0,
                isCritical: true,
                color: "#8f4f1f",
                colorClass: "border-fase4",
                bgClass: "bg-fase4",
                x: 650, y: 185,
                tasks: [
                    "Ejecutar algoritmo Apriori de Market Basket Analysis en Python (mlxtend)",
                    "Importar reglas de asociación y valor de lift a Power BI",
                    "Desarrollo DAX para scoring RFM (RANKX + CALCULATE)",
                    "Segmentar clientes en 4 grupos (Campeones, leales, en riesgo, perdidos)",
                    "Calcular Customer Lifetime Value (CLV) estimado por segmento"
                ],
                entregable: "Páginas del modelo con segmentación avanzada y reglas de canasta cruzada listas."
            },
            {
                id: 6,
                label: "Pulido, Narrativa & Storytelling",
                fase: "Fase 5",
                t: 7,
                es: 41, ef: 48,
                ls: 41, lf: 48,
                holgura: 0,
                isCritical: true,
                color: "#92352b",
                colorClass: "border-fase5",
                bgClass: "bg-fase5",
                x: 870, y: 185,
                tasks: [
                    "Diseño visual del dashboard con jerarquías claras y colores limpios",
                    "Crear página de Resumen Ejecutivo con 6 KPIs clave",
                    "Configuración de bookmarks interactivos para modo presentación / storytelling",
                    "Optimizar rendimiento de medidas DAX utilizando DAX Studio (VertiPaq Analyzer)",
                    "Grabar walkthrough explicativo de 5 minutos (Loom) para portfolio"
                ],
                entregable: "Dashboard final pulido y publicado en Power BI Service."
            },
            {
                id: 7,
                label: "Documentación & Diccionario",
                fase: "Fase 5",
                t: 7,
                es: 24, ef: 31,
                ls: 41, lf: 48,
                holgura: 17,
                isCritical: false,
                color: "#92352b",
                colorClass: "border-fase5",
                bgClass: "bg-fase5",
                x: 430, y: 410,
                tasks: [
                    "Estructuración formal del trabajo escrito final del integrador",
                    "Confección del diccionario de datos del esquema Galaxia",
                    "Compilar evidencia del proceso ágil Kanban (tablero Trello completo)"
                ],
                entregable: "Carpeta /docs completa y actualizada en repositorio GitHub."
            },
            {
                id: 8,
                label: "Informe Final & Cierre",
                fase: "Fase 6",
                t: 8,
                es: 48, ef: 56,
                ls: 48, lf: 56,
                holgura: 0,
                isCritical: true,
                color: "#3c6e4c",
                colorClass: "border-fase6",
                bgClass: "bg-fase6",
                x: 1080, y: 260,
                tasks: [
                    "Consolidación de todo el entregable final del proyecto",
                    "Preparación de la presentación final y defensa académica"
                ],
                entregable: "Cierre exitoso del proyecto y entrega formal."
            }
        ];

        // Definición de las dependencias (Relaciones lógicas entre tareas)
        const pertEdges = [
            { from: 1, to: 2, isCritical: true },
            { from: 2, to: 3, isCritical: true },
            { from: 2, to: 4, isCritical: false },
            { from: 2, to: 7, isCritical: false },
            { from: 3, to: 5, isCritical: true },
            { from: 4, to: 6, isCritical: false },
            { from: 5, to: 6, isCritical: true },
            { from: 6, to: 8, isCritical: true },
            { from: 7, to: 8, isCritical: false }
        ];

        let activeNodeId = 1;
        let showCriticalHighlight = true;

        // Renderizado del componente
        window.onload = function() {
            lucide.createIcons();
            renderPERTNodes();
            drawConnectingArrows();
            renderSelectedNodeDetails();
        };

        // Renderiza las tarjetas de los nodos en la posición correspondiente
        function renderPERTNodes() {
            const container = document.getElementById('nodes-container');
            container.innerHTML = '';

            pertNodes.forEach(node => {
                const isActive = node.id === activeNodeId;
                const activeRing = isActive ? 'ring-4 ring-indigo-500 ring-offset-2 scale-105 z-20' : '';
                const isCriticalGlow = (showCriticalHighlight && node.isCritical) ? 'shadow-[0_0_15px_rgba(244,63,94,0.4)] border-rose-500' : 'border-slate-300';
                
                container.innerHTML += `
                    <div 
                        onclick="selectNode(${node.id})"
                        class="absolute bg-white rounded-xl border-2 cursor-pointer transition-all duration-300 w-[180px] shadow-sm select-none ${activeRing} ${isCriticalGlow}"
                        style="left: ${node.x}px; top: ${node.y}px;"
                    >
                        <!-- Parte Superior (ES, t, EF) -->
                        <div class="grid grid-cols-3 text-center text-[10px] font-bold border-b border-slate-100 bg-slate-50 rounded-t-xl overflow-hidden divide-x divide-slate-100 font-mono text-slate-500">
                            <div class="py-1 bg-indigo-50/50 text-indigo-700" title="Pronto Inicio">${node.es}</div>
                            <div class="py-1 font-extrabold text-slate-700">${node.t}d</div>
                            <div class="py-1 bg-indigo-50/50 text-indigo-700" title="Pronto Fin">${node.ef}</div>
                        </div>

                        <!-- Parte Central (ID & Título de Tarea) -->
                        <div class="p-2.5 min-h-[62px] flex flex-col justify-center">
                            <div class="flex items-center gap-1.5 mb-1">
                                <span class="text-[8px] font-extrabold text-white px-1.5 py-0.5 rounded uppercase tracking-wider ${node.bgClass}">
                                    F${node.id}
                                </span>
                                <span class="text-[9px] font-semibold text-slate-400 font-mono">${node.semanas}</span>
                            </div>
                            <h4 class="text-xs font-extrabold text-slate-800 leading-tight line-clamp-2">
                                ${node.label}
                            </h4>
                        </div>

                        <!-- Parte Inferior (LS, H, LF) -->
                        <div class="grid grid-cols-3 text-center text-[10px] font-bold border-t border-slate-100 bg-slate-50 rounded-b-xl overflow-hidden divide-x divide-slate-100 font-mono text-slate-500">
                            <div class="py-1 bg-emerald-50/50 text-emerald-700" title="Tarde Inicio">${node.ls}</div>
                            <div class="py-1 ${node.holgura === 0 ? 'bg-rose-50 text-rose-600 font-extrabold' : 'bg-slate-100 text-slate-600'}" title="Holgura">H: ${node.holgura}</div>
                            <div class="py-1 bg-emerald-50/50 text-emerald-700" title="Tarde Fin">${node.lf}</div>
                        </div>
                    </div>
                `;
            });
        }

        // Dibuja las flechas de conexión con SVG curvas suaves (Bézier)
        function drawConnectingArrows() {
            const svgCanvas = document.getElementById('pert-svg-canvas');
            
            // Conservar defs originales
            const defs = svgCanvas.querySelector('defs').outerHTML;
            svgCanvas.innerHTML = defs;

            const nodeWidth = 180;
            const nodeHeight = 110;

            pertEdges.forEach(edge => {
                const fromNode = pertNodes.find(n => n.id === edge.from);
                const toNode = pertNodes.find(n => n.id === edge.to);

                if (fromNode && toNode) {
                    // Puntos de partida y llegada
                    const startX = fromNode.x + nodeWidth;
                    const startY = fromNode.y + (nodeHeight / 2);
                    const endX = toNode.x;
                    const endY = toNode.y + (nodeHeight / 2);

                    // Curva de control Bézier
                    const controlOffset = Math.abs(endX - startX) * 0.4;
                    const pathD = `M ${startX} ${startY} C ${startX + controlOffset} ${startY}, ${endX - controlOffset} ${endY}, ${endX} ${endY}`;

                    const isHighlight = showCriticalHighlight && edge.isCritical;
                    const strokeColor = isHighlight ? '#f43f5e' : '#94a3b8';
                    const strokeWidth = isHighlight ? '3.5' : '1.5';
                    const marker = isHighlight ? 'url(#arrow-critical)' : 'url(#arrow)';
                    const animationClass = isHighlight ? 'critical-path-arrow' : '';

                    svgCanvas.innerHTML += `
                        <path 
                            d="${pathD}" 
                            fill="none" 
                            stroke="${strokeColor}" 
                            stroke-width="${strokeWidth}" 
                            marker-end="${marker}"
                            class="${animationClass} transition-all duration-300"
                        />
                    `;
                }
            });
        }

        // Renderiza el detalle completo de la actividad seleccionada en la columna lateral
        function renderSelectedNodeDetails() {
            const container = document.getElementById('pert-details-panel');
            const node = pertNodes.find(n => n.id === activeNodeId);
            if (!node) return;

            // Formateador simple de días para presentación
            const formatDays = (d) => d === 1 ? '1 día' : `${d} días`;

            let tasksListHtml = '';
            node.tasks.forEach(task => {
                tasksListHtml += `
                    <li class="flex items-start gap-2 text-sm text-slate-600 leading-relaxed border-b border-slate-50 pb-2">
                        <i data-lucide="check-square" class="w-4 h-4 text-slate-400 mt-0.5 shrink-0"></i>
                        <span>${task}</span>
                    </li>
                `;
            });

            container.innerHTML = `
                <div class="animate-in fade-in slide-in-from-right-4 duration-300">
                    <!-- Cabecera del Inspector -->
                    <div class="p-5 text-white" style="background-color: ${node.color}">
                        <div class="flex items-center justify-between">
                            <span class="text-[10px] uppercase font-extrabold tracking-widest bg-white/20 px-2 py-0.5 rounded-md">
                                ${node.fase}
                            </span>
                            <span class="text-xs font-bold bg-white/15 px-2.5 py-1 rounded-lg">
                                Holgura: ${node.holgura} d
                            </span>
                        </div>
                        <h2 class="text-xl font-extrabold mt-2.5 leading-snug">
                            ${node.label}
                        </h2>
                        <div class="mt-4 flex items-center justify-between text-xs font-semibold opacity-90 border-t border-white/20 pt-3">
                            <span class="flex items-center gap-1"><i data-lucide="clock" class="w-3.5 h-3.5"></i> Duración: ${formatDays(node.t)}</span>
                            <span class="flex items-center gap-1"><i data-lucide="zap" class="w-3.5 h-3.5"></i> CP: ${node.isCritical ? 'Sí (Crítico)' : 'No'}</span>
                        </div>
                    </div>

                    <!-- Checklist de Tareas -->
                    <div class="p-5 space-y-5">
                        <div>
                            <h4 class="text-xs font-bold text-slate-400 uppercase tracking-widest mb-3 flex items-center gap-1.5">
                                <i data-lucide="list-todo" class="w-4 h-4 text-slate-400"></i> Checklist de la Etapa
                            </h4>
                            <ul class="space-y-2.5">
                                ${tasksListHtml}
                            </ul>
                        </div>

                        <!-- Entregable / Hito -->
                        <div class="pt-4 border-t border-slate-100">
                            <div class="bg-slate-900 rounded-xl p-4 text-white shadow-md relative overflow-hidden">
                                <div class="absolute -right-3 -top-3 text-white opacity-5">
                                    <i data-lucide="award" class="w-20 h-20"></i>
                                </div>
                                <h5 class="text-indigo-400 text-[10px] font-bold uppercase tracking-widest mb-1">
                                    Hito / Entregable Clave
                                </h5>
                                <p class="text-xs font-medium leading-relaxed">
                                    ${node.entregable}
                                </p>
                            </div>
                        </div>
                    </div>
                </div>
            `;
            lucide.createIcons();
        }

        // Selección interactiva de nodos
        function selectNode(id) {
            activeNodeId = id;
            renderPERTNodes();
            drawConnectingArrows();
            renderSelectedNodeDetails();
        }

        // Alternar el destacado de la ruta crítica
        function toggleCriticalHighlight() {
            showCriticalHighlight = !showCriticalHighlight;
            const btn = document.getElementById('btn-toggle-critical');
            
            if (showCriticalHighlight) {
                btn.className = "flex items-center gap-2 px-4 py-2.5 rounded-xl text-sm font-bold bg-rose-600 text-white shadow-md hover:bg-rose-700 transition-all";
                btn.innerHTML = `<i data-lucide="zap" class="w-4 h-4"></i> Destacar Ruta Crítica`;
            } else {
                btn.className = "flex items-center gap-2 px-4 py-2.5 rounded-xl text-sm font-bold bg-slate-200 text-slate-700 border border-slate-300 hover:bg-slate-300 transition-all";
                btn.innerHTML = `<i data-lucide="zap-off" class="w-4 h-4"></i> Sin Resaltado`;
            }
            
            renderPERTNodes();
            drawConnectingArrows();
            lucide.createIcons();
        }
    </script>
</body>
</html>
